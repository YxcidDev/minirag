<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniRAG Académico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <header>
        <h1>MiniRAG Académico</h1>
        <p>Asistente inteligente con Spring Boot, Spring AI y RAG</p>
    </header>

    <main>
        <section class="chat">
            <label for="question">Realiza una pregunta:</label>
            <textarea id="question" placeholder="Ejemplo: ¿Qué es RAG?" rows="4"></textarea>
            <button id="askButton" onclick="ask()">Preguntar</button>
        </section>

        <section class="result">
            <h2>Respuesta</h2>
            <p class="meta"><strong>Pregunta:</strong> <span id="currentQuestion">—</span></p>
            <div id="answer">La respuesta aparecerá aquí.</div>
            <p class="meta"><strong>Fecha:</strong> <span id="currentDate">—</span></p>
        </section>

        <section class="examples">
            <h2>Preguntas de prueba</h2>
            <button onclick="useQuestion('¿Qué es Spring Boot?')">¿Qué es Spring Boot?</button>
            <button onclick="useQuestion('¿Qué ventajas tienen los microservicios?')">Ventajas de microservicios</button>
            <button onclick="useQuestion('¿Qué es un embedding?')">¿Qué es un embedding?</button>
            <button onclick="useQuestion('¿Cómo funciona RAG?')">¿Cómo funciona RAG?</button>
        </section>

        <section class="history">
            <h2>Historial de consultas</h2>
            <div id="historyList">Cargando historial...</div>
        </section>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
