services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: minirag-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: minirag
    ports:
      - "5433:5432"
    volumes:
      - minirag_pgdata:/var/lib/postgresql/data

volumes:
  minirag_pgdata: